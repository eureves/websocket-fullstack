<div style="text-align: center">
  <h1>Welcome to {{ title() }}!</h1>
  <p>WebSocket connection status: <span id="status">Disconnected</span></p>

  <input
    [formControl]="messageControl"
    placeholder="Type a message..."
    type="text"
    style="margin-top: 20px; width: 300px; padding: 8px"
  />
  <button (click)="sendMessage()" style="margin: 15px">Send Message</button>

  <div style="margin-top: 20px">
    <h2>Messages:</h2>
    <ul>
      @for (msg of messages(); track msg) { @if (msg) {
      <li>
        <strong>{{ msg.content }}</strong> - {{ msg.timestamp }} (Random:
        <span style="color: blue">{{ msg.randomNumber }}</span>)
      </li>
      } }
    </ul>
  </div>
</div>
